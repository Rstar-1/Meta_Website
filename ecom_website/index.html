<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inraclick: Digital Marketing & Web Engineering Agency</title>
  <meta name="description" content="Inraclick (inraclick.com) is India's leading digital agency providing high-converting custom web development, Meta ad campaigns, SEO, and visual branding." />
  <meta name="keywords" content="Inraclick, inraclick.com, Inraclick Agency, Inraclick Digital, Digital Marketing Agency, Web Development, Meta Ads, SEO" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <link rel="canonical" href="https://inraclick.com" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Inraclick: Digital Marketing & Web Engineering Agency" />
  <meta property="og:description" content="Inraclick (inraclick.com) is India's premier digital agency delivering custom web engineering, Meta ad campaigns, SEO, and visual branding." />
  <meta property="og:url" content="https://inraclick.com" />
  <meta property="og:site_name" content="Inraclick" />
  <meta property="og:image" content="https://inraclick.com/sobo_logo.webp" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Inraclick: Digital Marketing & Web Engineering Agency" />
  <meta name="twitter:description" content="Inraclick (inraclick.com) is India's premier digital agency delivering custom web engineering, Meta ad campaigns, SEO, and visual branding." />
  <meta name="twitter:image" content="https://inraclick.com/sobo_logo.webp" />

  <!-- Structured Data JSON-LD for Search Engines & Google Rich Sitelinks -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://inraclick.com/#website",
        "url": "https://inraclick.com",
        "name": "Inraclick",
        "alternateName": ["Inraclick", "Inraclick.com", "Inraclick Digital Agency"],
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://inraclick.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@type": "Organization",
        "@id": "https://inraclick.com/#organization",
        "name": "Inraclick Digital Agency",
        "alternateName": ["Inraclick", "Inraclick.com", "Inraclick Agency"],
        "url": "https://inraclick.com",
        "logo": "https://inraclick.com/sobo_logo.webp"
      },
      {
        "@type": "SiteNavigationElement",
        "@id": "https://inraclick.com/home",
        "name": "Home",
        "url": "https://inraclick.com/home",
        "description": "Inraclick official homepage featuring digital marketing, web engineering, and ROI case studies."
      },
      {
        "@type": "SiteNavigationElement",
        "@id": "https://inraclick.com/about",
        "name": "About Us",
        "url": "https://inraclick.com/about",
        "description": "Learn about Inraclick Digital Agency, our vision, team, and client performance strategy."
      },
      {
        "@type": "SiteNavigationElement",
        "@id": "https://inraclick.com/services",
        "name": "Digital Services",
        "url": "https://inraclick.com/services",
        "description": "Inraclick full service agency offerings: web development, Meta advertising, SEO, and branding."
      },
      {
        "@type": "SiteNavigationElement",
        "@id": "https://inraclick.com/blog",
        "name": "Agency Insights",
        "url": "https://inraclick.com/blog",
        "description": "Read in-depth digital marketing guides, SEO checklists, and ad campaign tips by Inraclick."
      },
      {
        "@type": "SiteNavigationElement",
        "@id": "https://inraclick.com/connect",
        "name": "Connect",
        "url": "https://inraclick.com/connect",
        "description": "Get in touch with Inraclick digital strategists for project consultations and growth audits."
      }
    ]
  }
  </script>

  <!-- Preconnect to Google Fonts domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Ubuntu:wght@300;400;500;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
  </noscript>

  <link rel="preload" href="/background.webp" as="image" fetchpriority="high">
  <link rel="preload" href="/sobo_logo.webp" as="image" fetchpriority="high">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/app/main.jsx"></script>
</body>

</html>
