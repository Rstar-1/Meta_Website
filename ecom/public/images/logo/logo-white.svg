
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110">
  <defs>
    <style>
      .brand-title {
        font-family: 'Neue Montreal', 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 27px;
        letter-spacing: 2px;
      }
      .brand-accent {
        font-family: 'Neue Montreal', 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 21px;
        letter-spacing: 4.5px;
      }
      .brand-sub {
        font-family: 'Neue Montreal', 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 10px;
        letter-spacing: 2.5px;
      }
    </style>
  </defs>

  <!-- VP Emblem -->
  <g transform="translate(4, 10)">
    <image href="data:image/png;base64," x="0" y="0" width="90" height="90" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(108, 14)">
    <text x="0" y="32" class="brand-title" fill="#FFFFFF">VASU JAVAL</text>
    <text x="0" y="58" class="brand-accent" fill="#38BDF8">PLASTICS</text>
    <line x1="0" y1="69" x2="330" y2="69" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" />
    <text x="1" y="82" class="brand-sub" fill="#94A3B8">PRECISION INDUSTRIAL CLOSURES</text>
  </g>
</svg>
